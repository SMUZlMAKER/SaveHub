[package]
name = "savehub"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
junction = "2.1.0"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon"] }

uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
